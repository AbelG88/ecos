<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ecos</title>
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ecos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eff6ff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--accent:#3b82f6;--accent-d:#1e40af;--card-size:104px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Quicksand',-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit;}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:5;}
.top h1{margin:0;font-size:1.15rem;flex:1;}
.top button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;font-weight:600;}
.top button.on{background:#fff;color:var(--accent-d);}
.frase{background:#fff;margin:10px 12px 0;border-radius:22px;padding:10px;display:flex;gap:8px;align-items:center;min-height:84px;box-shadow:0 1px 3px rgba(30,41,59,.1);}
.frase .tira{flex:1;display:flex;gap:6px;overflow-x:auto;min-height:60px;align-items:center;}
.frase .vacia{color:var(--muted);font-size:.9rem;padding-left:6px;}
.mini{flex:none;width:58px;text-align:center;font-size:.62rem;font-weight:600;line-height:1.1;border-radius:12px;padding:4px 2px;background:var(--c,#e2e8f0);}
.mini .im{font-size:1.7rem;display:block;}
.mini img{width:34px;height:34px;object-fit:cover;border-radius:8px;}
.fbtn{flex:none;width:52px;height:52px;border-radius:50%;border:0;font-size:1.4rem;cursor:pointer;background:var(--line);}
.fbtn.say{background:var(--accent);color:#fff;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none;}
.chip{flex:none;border:0;background:#fff;border-radius:999px;padding:9px 15px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(30,41,59,.1);white-space:nowrap;}
.chip.sel{background:var(--accent);color:#fff;}
.chip.add{background:transparent;border:2px dashed #93c5fd;color:var(--accent-d);box-shadow:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-size),1fr));gap:10px;padding:2px 12px 24px;}
.card{border:0;border-radius:22px;background:var(--c,#fff);padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:calc(var(--card-size) + 12px);cursor:pointer;box-shadow:0 1px 3px rgba(30,41,59,.12);position:relative;}
.card:active{transform:scale(.96);}
.card .im{font-size:calc(var(--card-size) * .46);line-height:1;}
.card img{width:calc(var(--card-size) * .62);height:calc(var(--card-size) * .62);object-fit:cover;border-radius:14px;}
.card .lb{font-weight:700;font-size:.85rem;text-align:center;line-height:1.1;word-break:break-word;}
.card .n{position:absolute;top:6px;left:8px;font-size:.7rem;font-weight:700;background:#fff;border-radius:999px;padding:1px 7px;}
.page{padding:14px;display:grid;gap:12px;}
.box{background:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 1px 3px rgba(30,41,59,.08);}
.box h2{margin:0 0 6px;font-size:1rem;color:var(--accent-d);}
.box p{margin:0 0 8px;color:var(--muted);font-size:.88rem;line-height:1.4;}
.btn{display:block;width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:12px 14px;margin-top:8px;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:600;}
.btn.pri{background:var(--accent);color:#fff;border:0;text-align:center;}
.btn.del{color:#b91c1c;}
.row{display:flex;gap:8px;align-items:center;}
.row>*{flex:1;} .row>.sm{flex:none;}
input[type=text],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;}
.item{display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:16px;padding:8px 10px;margin-top:8px;}
.item .e{font-size:1.6rem;} .item .t{flex:1;font-weight:700;}
.item button{border:0;background:#e2e8f0;border-radius:10px;width:36px;height:36px;cursor:pointer;}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.emojis button{font-size:1.5rem;width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;}
.emojis button.sel{border-color:var(--accent);}
.play{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;}
.play .big{font-size:min(38vw,190px);line-height:1;}
.play img{width:min(60vw,260px);height:min(60vw,260px);object-fit:cover;border-radius:28px;}
.play .nm{font-size:2rem;font-weight:700;}
.play .pro{color:var(--muted);font-weight:700;}
.play .nav{display:flex;gap:12px;width:100%;max-width:420px;}
.play .nav button{flex:1;padding:16px;border-radius:18px;border:0;font-weight:700;font-size:1.1rem;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(30,41,59,.12);}
.play .nav .go{background:var(--accent);color:#fff;}
.play .x{position:absolute;top:14px;right:14px;border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.1rem;cursor:pointer;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;}
.toast.show{opacity:1;}
.vacio{text-align:center;color:var(--muted);padding:30px 20px;}
.cat{margin:14px 12px 4px;font-weight:700;color:var(--accent-d);font-size:.9rem;}
.search{margin:10px 12px 0;}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 12px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
